<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mua Gì Đây - Gợi ý món ăn sáng theo ngân sách, vị trí & feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div class="workspace-layout">
    <!-- ==================== MOBILE APP SHELL ==================== -->
    <div class="app-shell">
      <!-- Top App Header -->
      <header class="app-header">
        <div class="brand-group" id="brandHomeBtn" title="Về màn hình chính">
          <div class="brand-logo">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <span class="brand-title">Mua Gì Đây</span>
        </div>

        <div class="header-actions">
          <button class="btn-pill-header btn-lang" title="Ngôn ngữ">🇬🇧</button>
          <button class="btn-pill-header" id="btnNewSearchHeader" style="display: none;">
            <span>+ Tìm mới</span>
          </button>
          <button class="btn-pill-header" id="btnPersonalizeHeader">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <span>Cá nhân hóa</span>
          </button>
        </div>
      </header>

      <!-- Main Scrollable Viewport (Home / Chat / Radar / Results) -->
      <main class="app-main" id="appMainViewport"></main>

      <!-- Bottom Search & Quick Filter Dock -->
      <div class="bottom-dock-wrapper">
        <div class="search-dock-card">
          <div class="dock-location-line">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span id="dockFullAddress">Tìm quanh 68 Lê Văn Lương, Nhân Chính, Thanh Xuân</span>
          </div>

          <div class="dock-input-row">
            <input
              type="text"
              id="dockSearchInput"
              class="dock-search-input"
              placeholder="VD: 30k cà phê sữa"
              autocomplete="off"
            />
          </div>

          <div class="dock-filters-row">
            <div class="dock-chips-left">
              <!-- Location Chip -->
              <button class="filter-chip" id="chipLocationBtn" title="Nhấn để đổi khu vực">
                <svg class="chip-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span id="chipLocationLabel">68 Lê Văn...</span>
                <span>⌄</span>
              </button>

              <!-- Budget Chip (Shown after first query) -->
              <button class="filter-chip" id="chipBudgetBtn" style="display: none;" title="Nhấn để đổi mức ngân sách">
                <svg class="chip-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                  <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                  <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <span id="chipBudgetLabel">Số tiền</span>
                <span>⌄</span>
              </button>

              <!-- Radius Chip -->
              <button class="filter-chip" id="chipRadiusBtn" title="Nhấn để đổi bán kính tìm kiếm">
                <svg class="chip-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                  <circle cx="12" cy="12" r="2"></circle>
                  <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
                </svg>
                <span id="chipRadiusLabel">2km</span>
                <span>⌄</span>
              </button>
            </div>

            <!-- Submit Search Button -->
            <button class="btn-submit-search" id="btnSubmitSearch">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Tìm quán</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Sheet Modal (Full Menu, Customer Feedbacks & Personalization) -->
      <div class="modal-overlay" id="appModalOverlay">
        <div class="modal-sheet" id="appModalSheet"></div>
      </div>
    </div>

    <!-- ==================== DESKTOP SOA DEMO & SCREENSHOT JUMP PANEL ==================== -->
    <aside class="soa-side-panel">
      <div class="soa-panel-title">
        <span>🧭 Chuyển nhanh 8 Màn Hình Mẫu</span>
        <span class="soa-badge">UI Demo</span>
      </div>
      <p style="font-size: 0.77rem; color: var(--text-secondary); line-height: 1.4;">
        Bạn có thể tự gõ vào ô tìm kiếm bên trái (VD: <strong>"phở bò"</strong>, <strong>"30k cà phê"</strong>, <strong>"rẻ hơn"</strong>) hoặc bấm nút dưới đây để nhảy tới đúng từng hình ảnh bạn đã gửi:
      </p>

      <div class="preset-scenarios">
        <button class="btn-scenario" data-jump-screen="1">
          <span>1. Màn hình chào & Gợi ý thời tiết</span>
          <span class="step-tag">Hình 1</span>
        </button>
        <button class="btn-scenario" data-jump-screen="2">
          <span>2. Nhập món ăn ("phở bò")</span>
          <span class="step-tag">Hình 2</span>
        </button>
        <button class="btn-scenario" data-jump-screen="3">
          <span>3. Radar quét lần 1 & Tách ý định</span>
          <span class="step-tag">Hình 3</span>
        </button>
        <button class="btn-scenario" data-jump-screen="4">
          <span>4. Bot hỏi ngân sách (30k/50k/100k)</span>
          <span class="step-tag">Hình 4</span>
        </button>
        <button class="btn-scenario" data-jump-screen="5">
          <span>5. Chọn 50k & Radar quét quán</span>
          <span class="step-tag">Hình 5</span>
        </button>
        <button class="btn-scenario" data-jump-screen="6">
          <span>6. Kết quả: Pho Bo 158, dư 5k, Feedback</span>
          <span class="step-tag">Hình 6-8</span>
        </button>
      </div>

      <div class="soa-panel-title" style="margin-top: 6px;">
        <span>📡 SOA Service Trace Log</span>
        <span class="soa-badge">Live</span>
      </div>
      <div class="service-log-box" id="serviceLogBox"></div>
    </aside>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
